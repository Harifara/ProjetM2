services:

  # ============================
  # KONG (API GATEWAY)
  # ============================
  kong:
    image: kong:3.4
    container_name: kong
    restart: always
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_SSL_CERT: /kong/ssl/fullchain.pem
      KONG_SSL_CERT_KEY: /kong/ssl/privkey.pem
    volumes:
      - ./kong/kong.yml:/kong/kong.yml
      - ./kong/ssl:/kong/ssl
    ports:
      - "8000:8000"   # HTTP interne Kong (proxy)
      - "8443:8443"   # HTTPS interne Kong (proxy)
      - "80:8000"     # HTTP public
      - "443:8443" 

    depends_on:
      - auth_service
      - rh_service
      - stock_service
      - finance_service
      - cordo_service
    networks:
      - project_network


  # ============================
  # AUTH SERVICE
  # ============================
  auth_service:
    build: ./auth_service
    container_name: auth_service
    env_file: ./auth_service/.env
    ports:
      - "8000"   # accessible uniquement depuis le réseau interne
    restart: unless-stopped
    networks:
      - project_network

  # ============================
  # RH SERVICE
  # ============================
  rh_service:
    build: ./rh_service
    container_name: rh_service
    env_file: ./rh_service/.env
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - project_network

  # ============================
  # STOCK SERVICE
  # ============================
  stock_service:
    build: ./stock_service
    container_name: stock_service
    env_file: ./stock_service/.env
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - project_network

  # ============================
  # FINANCE SERVICE
  # ============================
  finance_service:
    build: ./finance_service
    container_name: finance_service
    env_file: ./finance_service/.env
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - project_network

  # ============================
  # CORDO SERVICE
  # ============================
  cordo_service:
    build: ./cordo_service
    container_name: cordo_service
    env_file: ./cordo_service/.env
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - project_network

# ============================
# NETWORK
# ============================
networks:
  project_network:
    driver: bridge
