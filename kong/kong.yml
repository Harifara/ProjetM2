_format_version: "3.0"
_transform: true

# ============================
# 🔐 CONSUMER (JWT)
# ============================
consumers:
  - username: auth-service
    custom_id: "auth-service"
    jwt_secrets:
      - consumer: null
        algorithm: HS256
        key: auth-service
        secret: my_super_secret_key_123

# ============================
# 🚪 SERVICES
# ============================
services:

  # -------------------------
  # AUTH SERVICE
  # -------------------------
  - name: auth-service
    url: http://auth_service:8000
    routes:
      - name: auth-route
        paths: ["/api/auth"]
        preserve_host: true
        strip_path: false
        hosts:
          - ecartmada.com
          - www.ecartmada.com
          - 51.21.42.34
    plugins:
      - name: cors
        config:
          origins:
            - "https://ecartmada.com"
            - "https://www.ecartmada.com"
            - "https://51.21.42.34"
            - "http://localhost:5173"
          methods: ["GET","POST","PUT","DELETE","PATCH","OPTIONS"]
          headers: ["Authorization","Content-Type","Accept","Origin"]
          exposed_headers: ["Authorization","X-Auth-Token"]
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  # -------------------------
  # RH SERVICE
  # -------------------------
  - name: rh-service
    url: http://rh_service:8000
    routes:
      - name: rh-route
        paths: ["/api/rh"]
        preserve_host: true
        strip_path: false
        hosts:
          - ecartmada.com
          - www.ecartmada.com
          - 51.21.42.34
    plugins:
      - name: jwt
        config:
          secret_is_base64: false
          key_claim_name: iss
          claims_to_verify: [exp]
      - name: cors
        config:
          origins:
            - "https://ecartmada.com"
            - "https://www.ecartmada.com"
            - "https://51.21.42.34"
            - "http://localhost:5173"
          methods: ["GET","POST","PUT","DELETE","PATCH","OPTIONS"]
          headers: ["Authorization","Content-Type","Accept","Origin"]
          exposed_headers: ["Authorization","X-Auth-Token"]
          credentials: true
          max_age: 3600

