_format_version: "3.0"
_transform: true

# ============================
# 🔐 CONSUMERS (JWT)
# ============================
consumers:
  - username: auth-service
    custom_id: "auth-service"
    jwt_secrets:
      - algorithm: HS256
        key: auth-service
        secret: my_super_secret_key_123

# ============================
# 🚪 SERVICES + ROUTES
# ============================
services:

  # ---------------------------
  # AUTH SERVICE
  # ---------------------------
  - name: auth-service
    url: http://auth_service:8000
    routes:
      - name: auth-route
        paths: ["/api/auth"]
        strip_path: false
        preserve_host: true
        protocols: ["http", "https"]
        hosts:
          - api.ecartmada.com
         
    plugins:
      - name: cors
        config:
          origins:
            - "https://ecartmada.com"
            - "https://www.ecartmada.com"
            - "http://localhost:5173"
            - "http://localhost:3000"
          methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
          headers: ["Authorization", "Content-Type", "Accept", "Origin", "X-Requested-With"]
          exposed_headers: ["Authorization", "X-Auth-Token"]
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  # ---------------------------
  # RH SERVICE
  # ---------------------------
  - name: rh-service
    url: http://rh_service:8000
    routes:
      - name: rh-route
        paths: ["/api/rh"]
        strip_path: false
        preserve_host: true
        protocols: ["http", "https"]
        hosts:
          - api.ecartmada.com
    plugins:
      - name: cors
        config:
          origins:
            - "https://ecartmada.com"
            - "https://www.ecartmada.com"
            - "http://localhost:5173"
            - "http://localhost:3000"
          methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
          headers: ["Authorization", "Content-Type", "Accept", "Origin", "X-Requested-With"]
          exposed_headers: ["Authorization", "X-Auth-Token"]
          credentials: true
          max_age: 3600
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify: ["exp"]

  # ---------------------------
  # STOCK SERVICE
  # ---------------------------
