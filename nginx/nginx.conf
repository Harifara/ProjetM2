server {
    listen 80;
    server_name api.ecartmada.com;

    # Servir les fichiers médias directement
    location /media/ {
        alias /app/media/;
        autoindex on;             # pour voir les fichiers si besoin
        access_log off;
    }

    # Passer le reste vers Kong
    location / {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
